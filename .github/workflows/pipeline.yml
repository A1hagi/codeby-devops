name: DevOps Diploma Pipeline

on:
  push:
    branches: [ "diploma-project", "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Multi-stage Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./diplom/app
        file: ./diplom/app/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/devops-webapp:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/devops-webapp:${{ github.sha }}

  deploy-to-senko-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy to Senko Digital via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: root
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          mkdir -p ~/k8s-deploy
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/devops-webapp:${{ github.sha }}"
          
          cat << EOF > ~/k8s-deploy/01-deployment.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: go-webapp
            namespace: default
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: go-webapp
            template:
              metadata:
                labels:
                  app: go-webapp
              spec:
                containers:
                - name: webapp
                  image: $IMAGE_TAG
                  ports:
                  - containerPort: 8080
                  resources:
                    limits:
                      memory: "128Mi"
                      cpu: "200m"
          EOF

          cat << 'EOF' > ~/k8s-deploy/02-service.yaml
          apiVersion: v1
          kind: Service
          metadata:
            name: go-webapp-service
            namespace: default
          spec:
            type: NodePort
            selector:
              app: go-webapp
            ports:
            - port: 80
              targetPort: 8080
              nodePort: 30080
          EOF

          kubectl apply -f ~/k8s-deploy/01-deployment.yaml
          kubectl apply -f ~/k8s-deploy/02-service.yaml
