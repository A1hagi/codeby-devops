version: '3.8'

services:
  db:
    image: mysql:5.7
    container_name: compose-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret_root_pass
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp_compose_user
      MYSQL_PASSWORD: wp_compose_pass
    volumes:
      - ./mysql-data:/var/lib/mysql
    networks:
      - backend-net

  app:
    image: wordpress:latest
    container_name: compose-wordpress
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp_compose_user
      WORDPRESS_DB_PASSWORD: wp_compose_pass
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./wordpress-data:/var/www/html
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - db

  proxy:
    image: nginx:alpine
    container_name: compose-nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx-config/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend-net
    depends_on:
      - app

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
