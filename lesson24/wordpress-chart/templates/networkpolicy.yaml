apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-mysql-netpol
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-mysql
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: {{ .Release.Name }}-wordpress
    ports:
    - protocol: TCP
      port: 3306
