---
- name: Load OS-specific variables
  include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_os_family }}.yml"
    - default.yml

- name: Ensure archiving utilities are installed
  package:
    name:
      - tar
      - gzip
      - unzip
    state: present
    update_cache: yes

- name: Install Apache and PHP packages
  package:
    name: "{{ apache_packages }}"
    state: present

- name: Start and enable Apache service
  service:
    name: "{{ apache_service }}"
    state: started
    enabled: yes

- name: Download WordPress archive
  get_url:
    url: https://wordpress.org/latest.tar.gz
    dest: /tmp/wordpress.tar.gz

- name: Extract WordPress
  unarchive:
    src: /tmp/wordpress.tar.gz
    dest: /var/www/html
    remote_src: yes
    extra_opts: [--strip-components=1]

- name: Set correct permissions on web root
  file:
    path: /var/www/html
    owner: "{{ apache_user }}"
    group: "{{ apache_user }}"
    recurse: yes
